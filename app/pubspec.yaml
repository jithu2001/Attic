name: attic
description: "Attic — self-hosted photos, music and video for phone, tablet and Android TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management and routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Design system
  dynamic_color: ^1.7.0
  cached_network_image: ^3.3.1
  animations: ^2.0.11

  # Playback
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  audio_session: ^0.1.19
  rxdart: ^0.28.0

  # Runtime permissions (Android 13+ notifications for the media controls)
  permission_handler: ^11.3.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
