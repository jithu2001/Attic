# Attic: one app binary + Postgres + Caddy.
#
# The stack is reached over Tailscale (e.g. https://homeserver.tailnet.ts.net),
# never a public domain. Caddy terminates TLS using a certificate obtained with
# `tailscale cert`; inside the tailnet plain HTTP on :8080 also works.

name: attic

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${ATTIC_VERSION:-dev}
    image: attic:${ATTIC_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATTIC_LISTEN_ADDR: ":8080"
      ATTIC_DATABASE_URL: "postgres://attic:${POSTGRES_PASSWORD:-attic}@postgres:5432/attic?sslmode=disable"
      ATTIC_DATA_DIR: "/data"
      ATTIC_MUSIC_DIR: "/data/music"
      ATTIC_LIBRARY_ROOTS: "${ATTIC_LIBRARY_ROOTS:-/data/originals,/data/music}"
      ATTIC_JWT_SECRET: "${ATTIC_JWT_SECRET:?set ATTIC_JWT_SECRET in .env (32+ bytes)}"
      ATTIC_LOG_LEVEL: "${ATTIC_LOG_LEVEL:-info}"
      ATTIC_LOG_FORMAT: "json"
    volumes:
      - originals:/data/originals
      - derived:/data/derived
      # Your existing music library, mounted read-only: Attic never writes to
      # it, and scanning is the only thing that reads it.
      - ${ATTIC_MUSIC_HOST_DIR:-./music}:/data/music:ro
    devices:
      # Intel QSV / VAAPI hardware transcoding. Comment out on hosts without
      # an Intel iGPU; FFmpeg falls back to software encoding.
      - /dev/dri:/dev/dri
    ports:
      # Exposed for development; in production Caddy is the only entry point.
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attic}
      POSTGRES_DB: attic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attic -d attic"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ATTIC_HOSTNAME: ${ATTIC_HOSTNAME:-homeserver.tailnet.ts.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Certificates produced by `tailscale cert <hostname>` on the host.
      - ./certs:/certs:ro
    ports:
      - "443:443"
      - "80:80"

volumes:
  originals:
  derived:
  pgdata:
  caddy_data:
  caddy_config:
